<!DOCTYPE html>
<html>
<head>
    <title>My First Page</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #e0f2f1;
            text-align: center;
            padding: 50px;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
            text-align: center;
            overflow: hidden;
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 5px solid white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            object-fit: cover;
            transform: scale(1.6);
        }
        .btn {
            background-color: #00796b;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="profile-card
        <img class="profile-img" src="Arshad.jpg" alt="Arshad Ali Logo">
        <h1>Hello, My name is Arshad Ali!</h1>
        <p>मैं एक web developer हूँ और बेहतरीन websites बनाता हूँ।</p>
        <a href="#" class="btn">मुझसे संपर्क करें</a>
    </div>

</body>
</html>
